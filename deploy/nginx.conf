# /etc/nginx/conf.d/chubblung.conf
server {
    listen 80;
    server_name _;

    location /imgs/ {
        alias /home/ec2-user/shop-express/imgs/;
        expires 7d;
    }

    location /static/ {
        alias /home/ec2-user/shop-express/public/;
        expires 10m;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
